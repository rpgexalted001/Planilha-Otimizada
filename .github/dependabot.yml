# Atualizações propostas exclusivamente por Pull Request.
# Sem merge automático nem execução de Build APK.
# Verificação mensal: reduz ruído e mantém visibilidade de versões novas.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "deps"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci-deps"
