# Auditoria manual do código Kotlin com CodeQL.
# Não produz APK nem obtém secrets de assinatura.
# Execute quando desejar verificar novas vulnerabilidades estáticas.
name: Kotlin CodeQL security audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Initialize Java/Kotlin CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Compile Kotlin sources for analysis without building APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain --no-configuration-cache

      - name: Analyze security findings
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
